[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-demo"
version = "0.2.0"
description = "Human-reviewed data-quality and workflow-recovery prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pandas>=2.2,<3", "requests>=2.32,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
